# Render Blueprint: the NestJS API on Render's free plan (test environment, ADR 0009).
# Setup steps and every variable: docs/guides/DEPLOYMENT.md.
# Secrets are never stored here: `sync: false` means "set in the Render dashboard".
services:
  - type: web
    name: sevenpalette-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    # Deploy a commit on main only after its GitHub checks (the CI workflow) pass.
    autoDeployTrigger: checksPass
    # No buildFilter: Render checks it against the last commit of a push only,
    # so a release whose last commit touches docs skipped the API (2026-11-08).
    # Node comes from .node-version. pnpm is pinned to the root `packageManager`
    # version. NODE_ENV=development for the install keeps the dev tools the
    # build needs (Nest CLI, TypeScript, Prisma CLI).
    buildCommand: >-
      NODE_ENV=development npx --yes pnpm@12.16.1 install --frozen-lockfile --filter api... &&
      npx --yes pnpm@12.16.1 --filter api build
    # The free plan has no pre-deploy step, so pending migrations run at start.
    startCommand: cd apps/api && ./node_modules/.bin/prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: shop-media
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
