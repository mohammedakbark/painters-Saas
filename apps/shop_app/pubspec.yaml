name: shop_app
description: Shop App for shop owners and staff (login-only; accounts are created on the web).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_shared:
    path: ../../packages/flutter_shared
  geolocator: 14.1.2
  go_router: 18.1.2
  image_picker: 1.2.4
  supabase_flutter: 2.18.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Launcher icons (DS-003). Regenerate the PNGs with
# `pnpm --filter design-tokens run logo`, then run
# `fvm dart run flutter_launcher_icons` in this folder.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../../packages/design_tokens/logo/png/app-icon-1024.png
  # brand.primary from packages/design_tokens/tokens.json.
  adaptive_icon_background: "#0F6B66"
  adaptive_icon_foreground: ../../packages/design_tokens/logo/png/app-icon-foreground-1024.png
  remove_alpha_ios: true
