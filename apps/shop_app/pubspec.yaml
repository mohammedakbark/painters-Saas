name: shop_app
description: Shop App for shop owners and staff (login-only; accounts are created on the web).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_shared:
    path: ../../packages/flutter_shared
  geolocator: 14.1.2
  go_router: 18.1.2
  image_picker: 1.2.4
  supabase_flutter: 2.18.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
