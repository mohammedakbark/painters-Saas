name: Keep test environment awake

# Free-tier test hosting (ADR 0009). Render's free API sleeps after 15 minutes
# without requests, and a Supabase free project pauses after a week without
# database activity. /health/ready answers from the API and runs `SELECT 1`, so
# one request keeps both awake. Runs every 10 minutes from about 06:30 to 22:30
# IST (01:00-16:59 UTC), about 480 hours a month, inside Render's 750 free hours.
# GitHub may delay scheduled runs; the first request after a gap can be slow.
# Set the repository variable API_BASE_URL (Settings > Secrets and variables >
# Actions > Variables), e.g. https://sevenpalette-api.onrender.com.

on:
  schedule:
    - cron: '*/10 1-16 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping API readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - name: Request /health/ready
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::notice::API_BASE_URL is not set; nothing to ping."
            exit 0
          fi
          # A sleeping service takes up to about a minute to wake.
          curl --silent --show-error --fail --retry 3 --retry-delay 20 \
            --retry-all-errors --max-time 90 "$API_BASE_URL/health/ready"
