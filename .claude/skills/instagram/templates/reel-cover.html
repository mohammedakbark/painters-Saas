<!doctype html>
<!--
  Reel cover, 1080x1920 (9:16). The grid crops it to the centre 1080x1350, so all text sits inside .safe.
  Copy to marketing/instagram/output/day-XX-reel/cover.html, replace every {{TOKEN}}, then render (see SKILL.md).
  Tokens: KICKER, HOOK (the on-screen hook, max ~7 words), ML_LINE. No product name; the zero.byt credit is fixed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 600; src: url("../../../../packages/flutter_shared/fonts/Inter-SemiBold.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("../../../../packages/flutter_shared/fonts/Inter-Bold.ttf"); }
      :root { --primary: #1f4b7a; --primary-strong: #163a5f; --primary-soft: #eaf1f8; --accent: #f5b544; --text: #17212f; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; }
      body {
        font-family: "Inter", "Nirmala UI", "Noto Sans Malayalam", sans-serif; color: #fff;
        background: linear-gradient(180deg, var(--primary-strong) 0%, var(--primary) 55%, var(--primary-strong) 100%);
        position: relative;
      }
      .band { position: absolute; left: 0; right: 0; height: 18px; background: var(--accent); }
      .band.top { top: 285px; } .band.bottom { bottom: 285px; }
      .safe {
        position: absolute; top: 285px; left: 0; width: 1080px; height: 1350px;
        padding: 120px 96px; display: flex; flex-direction: column; justify-content: center;
      }
      .kicker {
        align-self: flex-start; background: var(--accent); color: var(--text); font-weight: 700; font-size: 32px;
        letter-spacing: 0.08em; text-transform: uppercase; padding: 14px 28px; border-radius: 12px;
      }
      h1 { margin-top: 56px; font-size: 120px; line-height: 1.02; font-weight: 700; letter-spacing: -0.02em; }
      .ml { margin-top: 48px; font-size: 44px; line-height: 1.5; font-weight: 600; color: var(--primary-soft); }
      .powered { position: absolute; bottom: 110px; left: 96px; display: flex; align-items: center; gap: 20px; }
      .powered .label { font-size: 26px; font-weight: 600; opacity: 0.8; }
      .logo-chip { background: #fff; border-radius: 14px; width: 260px; height: 78px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      .logo-chip img { width: 300px; height: 300px; object-fit: cover; margin: -6px 0 0; }
    </style>
  </head>
  <body>
    <div class="band top"></div>
    <div class="safe">
      <div class="kicker">{{KICKER}}</div>
      <h1>{{HOOK}}</h1>
      <p class="ml" lang="ml">{{ML_LINE}}</p>
      <div class="powered"><span class="label">Powered by</span><span class="logo-chip"><img src="../../assets/zerobyt-logo.png" alt="zero.byt" /></span></div>
    </div>
    <div class="band bottom"></div>
  </body>
</html>
