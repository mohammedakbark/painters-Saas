name: flutter_shared
description: Design tokens and theme shared by the Customer App and Shop App.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_map: 8.3.2
  latlong2: 0.10.1
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Inter 4.1 static instances (SIL Open Font License 1.1, see fonts/OFL.txt).
  # Apps use them through AppTheme, which sets package: 'flutter_shared'.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
